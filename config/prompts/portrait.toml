[user.advanced.standard]
prompt = """Generate a Z-Image prompt for realistic, photorealistic image generation (80-150 words). ONLY describe VISIBLE features.

STRUCTURE - Write exactly 5-6 SENTENCES:
1. Subject + framing: "Close-up portrait of a [age] [gender] with [skin tone], [pose]."
2. Expression with COMPARISON: Use vivid comparisons like "warm smile like greeting an old friend" or "intense gaze as if studying something carefully" or "serene expression as if lost in peaceful thought"
3. Hair + distinctive features: Mark unique styles with IMPORTANT: (e.g., "IMPORTANT: single braid over right shoulder only")
4. Clothing: Mark unique patterns with CRITICAL: (e.g., "CRITICAL: zigzag trim pattern on edges")
5. Lighting + background
6. Technical: "No text, no watermark."

MANDATORY ELEMENTS:
1. FRAMING: "portrait framing" / "close-up" / "medium shot" / "full body"
2. POSE: "facing camera" / "three-quarter view" / "side profile"
3. EXPRESSION with comparison (see examples above)

EMPHASIS RULES:
- IMPORTANT: prefix for unique hair styles, distinctive accessories, unusual poses
- CRITICAL: prefix for patterns, specific colors, or details that define the look
- Repeat critical identifiers 2x if they're the main feature

EXPRESSION COMPARISONS (use these):
- Happy: "smile like sharing a secret" / "grin as if hearing good news"
- Serious: "focused gaze like studying details" / "determined look as if facing a challenge"
- Relaxed: "peaceful expression as if meditating" / "content look like enjoying a quiet moment"
- Playful: "mischievous smile like planning something fun" / "eyes sparkling as if amused"

DETAILS TO INCLUDE:
- Skin tone, eye color/shape, hair style + texture + color
- Clothing (type, color, material, where it ends)
- Lighting (pick ONE mood)
- Background

Write as flowing sentences, NOT comma-separated tags."""

[user.advanced.detailed]
prompt = """Generate a COMPREHENSIVE Z-Image prompt for realistic, photorealistic image generation (150-250 words). ONLY VISIBLE features.

MANDATORY FIRST (include ALL):
1. FRAMING: "portrait framing" / "close-up" / "medium shot" / "full body" - REQUIRED
2. POSE: "facing camera" / "three-quarter view" / "side profile" - REQUIRED
3. EXPRESSION: detailed description (intense piercing gaze, warm confident smile) - REQUIRED

FRAMING DETAILS:
- Shot type (ECU/CU/MCU/MS/MFS/FS/LS)
- Body parts visible vs cropped
- Frame cutoff point (e.g., "cropped at mid-thigh")
- Rule of thirds positioning

SUBJECT - use specific visual vocabulary:
- SKIN TONE: warm ivory, cool beige, golden tan, olive, deep brown, porcelain, sun-kissed, freckled
- FACE ANGLE: front view, 45° angle, three-quarter, profile left/right
- EYE SHAPE: almond, round, hooded, deep-set, upturned, downturned
- EYE COLOR: steel grey, warm brown, pale blue, amber, hazel, green

HAIR (GENDER-SPECIFIC):
- FEMALE styles: bob, pixie, long layers, braided, ponytail, loose waves, updo, tight curls
- MALE styles: buzz cut, fade, undercut, slicked back, textured crop, pompadour, side part, man bun
- TEXTURE: silky straight, wavy, coily, frizzy, windswept, sleek

FACIAL HAIR (male subjects): clean-shaven, light stubble, heavy stubble, designer stubble, short trimmed beard, full thick beard, goatee, mustache

FACE FEATURES (male subjects): square jaw, chiseled features, rugged/weathered, boyish face, strong brow, cleft chin

BODY TYPE:
- MALE: muscular/athletic, lean/toned, stocky/solid, broad-shouldered, barrel-chested, bodybuilder build
- FEMALE: slim, athletic, curvy, petite

IF SHIRTLESS/BARE-CHESTED (describe in detail):
