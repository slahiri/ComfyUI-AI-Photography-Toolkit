BODY POSITIONING: Describe each limb independently - shoulders, arms, hands, legs

CLOTHING (if worn):
- Each item 3-5 words (type, color, material, fit)
- MUST specify garment length: "short waistcoat ending at waist", "long coat extending to thighs"

ACCESSORIES: Identify held objects PRECISELY (ornate golden sword, leather satchel - not "object" or "item")

LIGHTING PATTERN - pick ONE mood (don't mix warm/cool):
- WARM: golden hour warmth, sunset glow, candlelight
- COOL: overcast daylight, blue hour, moonlight
- DRAMATIC: Rembrandt (triangle shadow on cheek), split (half-face lit)
- SOFT: diffused daylight, window light, high key
- DESCRIBE: Where highlights fall, where shadows form

BACKGROUND: Type, color palette, blur level

END: "correct human anatomy, no text, no watermark, no logos"

Write as flowing narrative, NOT tags."""

