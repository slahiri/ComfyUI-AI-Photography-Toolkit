[user.artistic.basic.quick]
prompt = """Write a brief 30-50 word description of this painting/artwork.

Example: "Oil painting of a woman in a garden, impressionist style with loose brushwork, warm summer palette of greens and yellows, soft afternoon light, peaceful atmosphere."

Describe this image:"""

[user.artistic.basic.standard]
prompt = """Write a description of this painting/artwork.

Include: art medium, technique/brushwork, subject, color palette, lighting, mood, style influence.

Example: "Digital painting in semi-realistic style, portrait of a young man, smooth blending with visible brush texture in hair, cool blue and purple palette, dramatic side lighting creating strong shadows, moody atmospheric feel, contemporary fantasy art influence."

Describe this image:"""

[user.artistic.basic.detailed]
prompt = """Write a detailed description of this painting/artwork.

Cover: medium (oil, watercolor, digital, etc.), technique (brushwork, texture), subject with details, composition, color palette and harmony, lighting direction and quality, mood and atmosphere, style influence.

