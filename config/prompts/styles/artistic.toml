# =============================================================================
# Artistic/Traditional Media Style Prompts
# =============================================================================
# Specialized prompts for paintings, sketches, illustrations, and traditional art


# =============================================================================
# SYSTEM PROMPTS
# =============================================================================

[system.artistic.advanced]
base = """You are an expert visual analyst generating prompts for artistic/traditional media AI image generation.

For ARTISTIC images (paintings, sketches, illustrations), use this approach:
- Identify the MEDIUM (oil painting, watercolor, pencil sketch, digital painting)
- Describe brushwork or line quality (loose, precise, textured)
- Note color palette and harmony (complementary, analogous, monochromatic)
- Describe composition and focal points
- Include lighting mood and atmosphere
- Note art movement influence if apparent (impressionist, realistic, abstract)

Structure: Medium → Technique → Subject → Composition → Color palette → Lighting/mood → Style influence

Output ONLY the prompt text - no explanations, no formatting, no markdown."""

[system.artistic.standard]
base = """You are an image analysis expert creating prompts for artistic AI image generation.

Follow this structure:
1. Art medium (oil, watercolor, pencil, digital)
2. Technique and brushwork
3. Subject description
4. Color palette
5. Lighting and mood
6. Composition style

Write flowing sentences. Output only the description."""

[system.artistic.basic]
base = """You are an image captioning assistant for paintings and artistic images.

Write a description covering:
- Art medium and style
- Subject appearance
- Color palette
- Mood and atmosphere
- Composition

Output ONLY the description. Start directly."""


# =============================================================================
# USER PROMPTS - ADVANCED TIER
# =============================================================================

[user.artistic.advanced.quick]
prompt = """Generate a brief artistic/painting style prompt (30-60 words) covering:
- Art medium (oil, watercolor, digital, sketch)
- Subject basics
- Color palette
- Mood/atmosphere
- Style influence

Write as flowing sentences."""

[user.artistic.advanced.standard]
prompt = """Generate an artistic/painting style prompt covering:
MEDIUM: Specific medium (oil painting, watercolor, pencil sketch, charcoal, digital painting)
TECHNIQUE: Brushwork style (loose, precise, impasto, glazed, textured)
SUBJECT: Main subject description
COMPOSITION: Arrangement, focal point, rule of thirds
COLORS: Palette type (warm, cool, complementary, monochromatic)
LIGHTING: Direction, quality, mood
STYLE: Art movement influence (impressionist, realistic, abstract, classical)

Write as flowing natural sentences. End with "artistic painting, [medium] style"."""

[user.artistic.advanced.detailed]
prompt = """Generate a COMPREHENSIVE artistic/painting style prompt:

MEDIUM & TECHNIQUE:
- Specific medium (oil on canvas, watercolor on paper, digital painting)
- Brush/tool characteristics (round brushes, palette knife, wet-on-wet)
- Texture quality (smooth, textured, impasto, glazed)
- Finish (matte, glossy, rough)

SUBJECT:
- Primary subject description
- Secondary elements
- Relationship between elements

COMPOSITION:
- Layout (rule of thirds, golden ratio, centered)
- Focal point placement
- Leading lines and eye flow
- Negative space usage

COLOR PALETTE:
- Dominant colors
- Color harmony (complementary, analogous, triadic)
- Value range (high key, low key, full range)
- Saturation levels

LIGHTING & ATMOSPHERE:
- Light source direction
- Light quality (soft, harsh, diffused)
- Shadow treatment
- Overall mood (dramatic, serene, mysterious)

STYLE INFLUENCE:
- Art movement (impressionism, realism, romanticism, abstract)
- Artist influence if apparent
- Period characteristics

Write as flowing natural sentences. End with "professional [medium] painting, artistic composition, museum quality"."""

[user.artistic.advanced.extreme]
prompt = """Generate an EXTREMELY detailed artistic/painting style prompt with MAXIMUM precision.

Analyze EVERY visible element:

MEDIUM ANALYSIS:
- Exact medium (oil on linen, watercolor on cold press, graphite on bristol, digital)
- Canvas/paper texture visibility
- Paint application (alla prima, layered glazes, impasto, washes)
- Tool marks (brush strokes, palette knife, sponge, finger)

TECHNIQUE SPECIFICS:
- Brushwork character (loose gestural, tight controlled, broken color)
- Edge handling (lost and found edges, hard edges, soft blending)
- Underpainting evidence
- Finishing techniques (varnish, fixative effects)

SUBJECT RENDERING:
- Primary subject with all details
- Secondary subjects and their treatment
- Background handling (detailed, suggested, abstract)
- Focus hierarchy

COMPOSITIONAL ANALYSIS:
- Overall structure (pyramid, diagonal, s-curve, grid)
- Focal point and visual hierarchy
- Balance (symmetrical, asymmetrical)
- Rhythm and repetition
- Framing elements

COLOR THEORY APPLICATION:
- Dominant hue and supporting colors
- Color temperature shifts
- Value structure (light pattern, shadow shapes)
- Chroma variation
- Color mixing evidence (optical mixing, physical mixing)

LIGHT AND ATMOSPHERE:
- Primary light source (natural, artificial, multiple)
- Light color temperature
- Shadow color and transparency
- Atmospheric perspective
- Reflected light

STYLE AND INFLUENCE:
- Art historical period
- Specific movement characteristics
- Individual artist influence
- Contemporary vs. traditional approach

Write as a comprehensive flowing narrative. End with "masterwork [medium] painting, exceptional technique, gallery quality, artistic excellence"."""


