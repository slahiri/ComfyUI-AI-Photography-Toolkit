# =============================================================================
# Western Comic Book Style Prompts
# =============================================================================
# Specialized prompts for Marvel, DC, indie comics, and graphic novels


# =============================================================================
# SYSTEM PROMPTS
# =============================================================================

[system.comic.advanced]
base = """You are an expert visual analyst generating prompts for Western comic book style AI image generation.

For COMIC BOOK images (Marvel, DC, indie comics), use this approach:
- Describe the COMIC STYLE (American superhero, indie, graphic novel, noir)
- Note line art characteristics (bold outlines, hatching, cross-hatching)
- Describe dynamic poses and action compositions
- Include color style (Ben-Day dots, flat colors, painted)
- Note panel composition elements if present
- Describe heroic proportions and muscular physiques if applicable

Structure: Comic style → Line art → Character design → Costume/outfit → Pose/action → Background → Color treatment

Output ONLY the prompt text - no explanations, no formatting, no markdown."""

[system.comic.standard]
base = """You are an image analysis expert creating prompts for comic book style AI image generation.

Follow this structure:
1. Comic style (superhero, indie, graphic novel)
2. Line art style (bold, hatched, clean)
3. Character design and proportions
4. Costume or outfit details
5. Pose and action
6. Background and setting
7. Color treatment (flat, painted, halftone)

Write flowing sentences. Output only the description."""

[system.comic.basic]
base = """You are an image captioning assistant for comic book images.

Write a description covering:
- Comic art style
- Character appearance and costume
- Pose and expression
- Background
- Color style

Output ONLY the description. Start directly."""


# =============================================================================
# USER PROMPTS - ADVANCED TIER
# =============================================================================

[user.comic.advanced.quick]
prompt = """Generate a brief comic book style prompt (30-60 words) covering:
- Comic style (superhero, indie, graphic novel)
- Line art style
- Character basics (costume, physique)
- Pose
- Background type

Write as flowing sentences."""

[user.comic.advanced.standard]
prompt = """Generate a comic book style prompt covering:
COMIC STYLE: Specific style (American superhero, indie, noir, manga-influenced)
LINE ART: Bold outlines, hatching, clean lines
CHARACTER: Physique, costume design, heroic proportions if applicable
FACE: Expression, eye style, jawline
POSE: Dynamic action pose or static
COLORING: Flat colors, painted, halftone/Ben-Day dots
BACKGROUND: Setting, panel-style composition

Write as flowing natural sentences. End with "bold lines, dynamic comic art"."""

[user.comic.advanced.detailed]
prompt = """Generate a COMPREHENSIVE comic book style prompt:

COMIC STYLE:
- Specific era/publisher style (Golden Age, Modern Marvel, DC, Image, indie)
- Panel composition influence
- Narrative tone (action, dramatic, noir)

LINE ART:
- Outline thickness (bold, medium, thin)
- Hatching and cross-hatching for shading
- Ink quality (clean, rough, expressive)

CHARACTER DESIGN:
- Body type (heroic proportions, realistic, stylized)
- Costume/outfit with all details
- Face style (square jaw, expressive, stylized)
- Hair treatment

POSE & ACTION:
- Dynamic pose or static composition
- Foreshortening and perspective
- Action lines if present
- Weight and balance

COLORING:
- Color treatment (flat, gradient, painted)
- Halftone/Ben-Day dots presence
- Color palette (primary colors, muted, noir)
- Shadow rendering

BACKGROUND:
- Setting type
- Level of detail
- Perspective and depth

Write as flowing natural sentences. End with "bold dynamic lines, professional comic book art, high contrast"."""

[user.comic.advanced.extreme]
prompt = """Generate an EXTREMELY detailed comic book style prompt with MAXIMUM precision.

Analyze EVERY visible element:

COMIC STYLE ANALYSIS:
- Exact style period (Golden Age 40s-50s, Silver Age 60s-70s, Bronze Age 70s-80s, Modern 90s+)
- Publisher aesthetic (Marvel house style, DC, Image, Dark Horse, indie)
- Genre indicators (superhero, noir, horror, sci-fi)
- Panel influence (splash page, action panel, quiet moment)

LINE ART SPECIFICATIONS:
- Primary outline weight (bold 3-4pt, medium 2pt, fine 1pt)
- Secondary line detail (hatching density, cross-hatch patterns)
- Ink style (brushwork, pen, digital clean)
- Speed lines, motion lines, impact effects
- Spotted blacks (heavy noir shadows)

CHARACTER DESIGN:
- Body type (heroic 8-head proportions, realistic 7-head, stylized)
- Musculature detail level (anatomically detailed, simplified, exaggerated)
- Costume/outfit breakdown (every element)
- Mask/face details
- Hair rendering (ink wash, detailed strands, simplified)

POSE & COMPOSITION:
- Dynamic angle (foreshortened punch, leap, flight pose)
- Weight and balance
- Action direction (left-to-right, toward viewer)
- Hand and fist details
- Cape/fabric dynamics

COLORING TECHNIQUE:
- Base color approach (flat, cel-shaded, fully painted)
- Halftone/Ben-Day dot presence and density
- Gradient usage
- Color holds (colored line art)
- Palette (primary superhero, muted realistic, noir limited)

BACKGROUND & ENVIRONMENT:
- Setting specificity
- Depth layers (foreground, mid, background)
- Environmental effects (explosions, debris, smoke)
- Perspective accuracy

Write as a comprehensive flowing narrative. End with "professional comic book illustration, bold dynamic linework, high contrast, heroic composition"."""


