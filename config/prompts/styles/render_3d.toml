Write as flowing sentences."""

[user.render_3d.advanced.standard]
prompt = """Generate a 3D render style prompt covering:
RENDER STYLE: Type (stylized/semi-realistic/photorealistic/Pixar/anime-3D)
CHARACTER: Design, proportions, key features
MATERIALS: Skin shader quality, hair rendering, cloth
LIGHTING: Setup type (HDRI, three-point, dramatic)
CAMERA: Angle, focal length feel
BACKGROUND: Environment or backdrop
QUALITY: Render quality indicators

Write as flowing natural sentences. End with "high quality 3D render, detailed materials, professional lighting"."""

[user.render_3d.advanced.detailed]
prompt = """Generate a COMPREHENSIVE 3D render style prompt:

RENDER STYLE:
- Style category (Pixar-like, anime-3D, realistic, stylized, hyperreal)
- Software aesthetic if apparent (Blender, Unreal, Cinema4D)
- Quality tier (professional, indie, AAA game)

CHARACTER MODEL:
- Design style (stylized proportions, realistic, chibi-3D)
- Topology quality indicators
- Silhouette appeal
- Facial rig quality

MATERIALS & SHADERS:
- Skin (subsurface scattering quality, pore detail)
- Hair (strand-based, cards, geometry)
- Eyes (shader complexity, reflections)
- Cloth (simulation quality, material type)

LIGHTING SETUP:
- Key light direction and color
- Fill light presence
- Rim/back light
- Ambient occlusion
- Global illumination quality

CAMERA & COMPOSITION:
- Focal length feel (wide, normal, telephoto)
- Depth of field
- Camera angle
- Composition style

POST-PROCESSING:
- Color grading
- Bloom or glow
- Chromatic aberration
- Film grain

ENVIRONMENT:
- Background type
- Environmental lighting contribution
- Props and set dressing

Write as flowing natural sentences. End with "professional 3D render, cinematic lighting, detailed materials, high quality CG"."""

[user.render_3d.advanced.extreme]
prompt = """Generate an EXTREMELY detailed 3D render style prompt with MAXIMUM precision.

Analyze EVERY visible element:

RENDER PIPELINE ANALYSIS:
- Render engine indicators (path-traced, rasterized, hybrid)
- Style classification (stylized, semi-realistic, photorealistic)
- Production quality tier (student, professional, AAA, film)
- Software aesthetic markers

CHARACTER MODEL DETAILS:
- Poly count impression (low, mid, high, sculpted)
- Topology flow quality
- Subdivision level
- Proportions (realistic, stylized, exaggerated)
- Silhouette design
- Edge flow and deformation quality

MATERIAL BREAKDOWN:
Skin:
- Subsurface scattering (depth, color)
- Specular/roughness variation
- Micro-detail (pores, imperfections)
- Makeup or paint layers

Hair:
- Rendering method (geometry, cards, strands, groom)
- Shine and specularity
- Flyaways and detail
- Color variation

Eyes:
- Shader complexity (simple, anatomical)
- Reflection quality
- Catchlight placement
- Iris detail

Clothing:
- Cloth simulation quality
- Fabric material (cotton, silk, leather, etc.)
- Wrinkle detail
- Seams and stitching

LIGHTING ANALYSIS:
- Key light (direction, intensity, color temperature)
- Fill light (ratio to key, color)
- Rim/hair light (presence, color)
- Ambient/environment light
- Shadow softness and color
- Specular highlights quality
- Global illumination presence

CAMERA SETTINGS:
- Focal length (wide/normal/telephoto feel)
- Aperture (depth of field)
- Camera height and angle
- Lens distortion

POST-PROCESSING:
- Color grading style
- Contrast and saturation
- Bloom/glow effects
- Lens effects (CA, vignette, flares)
- Grain or noise

Write as a comprehensive flowing narrative. End with "professional CG render, cinematic quality, detailed materials, realistic lighting, production quality 3D art"."""


