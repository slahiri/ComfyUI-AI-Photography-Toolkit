[user.furry.advanced.standard]
prompt = """Generate an anthropomorphic character prompt covering:
SPECIES: Exact species (wolf, fox, dragon, etc.)
ANTHRO LEVEL: Full anthro, kemono, feral, semi-anthro
FUR/SCALES: Primary color, secondary markings, patterns
BODY TYPE: Plantigrade (human legs) or digitigrade (animal legs)
BUILD: Muscular, slim, chubby, athletic
FACE: Muzzle shape, ear type, eye color and style
EXPRESSION: Emotion and expression
CLOTHING: Each item if present
POSE: Body position
BACKGROUND: Setting
ART STYLE: Western furry, kemono, realistic, toony

Write as flowing natural sentences."""

[user.furry.advanced.detailed]
prompt = """Generate a COMPREHENSIVE anthropomorphic character prompt:

SPECIES & STYLE:
- Exact species or hybrid
- Anthropomorphism level (full anthro, kemono, feral)
- Art style (western furry, kemono, realistic, semi-realistic)

FUR/MARKINGS:
- Primary fur/scale/feather color
- Secondary colors and patterns
- Marking details (stripes, spots, gradients)
- Fur texture and length

BODY STRUCTURE:
- Leg type (plantigrade human-style, digitigrade animal-style)
- Body build (muscular, athletic, slim, chubby)
- Height/size impression
- Tail type and position

FACIAL FEATURES:
- Muzzle/snout shape and size
- Ear type (pointed, floppy, rounded)
- Eye style (realistic, anime, toony)
- Eye color
- Nose type
- Whiskers if applicable

EXPRESSION:
- Emotion displayed
- Ear position indicating mood
- Tail position indicating mood
- Mouth/teeth visibility

CLOTHING/ACCESSORIES:
- Each clothing item with colors
- Accessories (jewelry, collar, glasses)
- Held items

POSE & COMPOSITION:
- Body pose
- Hand/paw positions
- Camera angle
- Frame (headshot, full body, etc.)

BACKGROUND:
- Setting type
- Detail level
- Lighting

Write as flowing natural sentences."""

[user.furry.advanced.extreme]
prompt = """Generate an EXTREMELY detailed anthropomorphic character prompt with MAXIMUM precision.

Analyze EVERY visible element:

SPECIES IDENTIFICATION:
- Exact species (subspecies if identifiable)
- Hybrid elements if mixed species
- Anthropomorphism level (full anthro, kemono, feral, taur, etc.)

ART STYLE:
- Style category (western furry, kemono/anime-furry, realistic, toony, disney)
- Line art style
- Shading technique
- Color saturation

FUR/COVERING DETAILS:
- Primary base color (exact shade)
- Secondary color(s) and placement
- Marking pattern (solid, gradient, stripes, spots, rosettes)
- Marking locations (face, chest, belly, back, limbs, tail)
- Fur texture (short sleek, medium fluffy, long flowing)
- Fur direction/flow

BODY ANATOMY:
- Leg structure (plantigrade/digitigrade)
- Paw/hand type (paws, hand-paws, human hands)
- Body type (muscular definition, body fat, athletic)
- Proportions (realistic animal, stylized, exaggerated)
- Tail (type, length, fluffiness, position)
- Wings if present (type, position, color)

FACIAL FEATURES:
- Head shape (species-accurate, stylized)
- Muzzle (length, width, shape)
- Nose (color, shape)
- Eyes (shape, size, color, highlights, pupil shape)
- Ears (shape, position, inner color)
- Mouth (open/closed, teeth visible, tongue)
- Whiskers (if applicable)
- Facial markings

EXPRESSION & BODY LANGUAGE:
- Facial expression
- Ear position (forward, back, perked, drooped)
- Eye expression (happy, sad, angry, sultry)
- Tail position (indicating mood)
- Overall body language

CLOTHING (if present):
- Each garment (type, color, material, fit)
- Accessories (collars, jewelry, piercings)
- Footwear (if any, or bare paws)
- Held items

POSE:
- Overall body position
- Weight distribution
- Arm/wing positions
- Leg positions
- Head tilt

BACKGROUND:
- Environment type
- Detail level
- Lighting source and color
- Atmosphere

Write as a comprehensive flowing narrative."""


