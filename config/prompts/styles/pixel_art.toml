[user.pixel_art.advanced.standard]
prompt = """Generate a pixel art style prompt covering:
PIXEL STYLE: Era/resolution (8-bit NES, 16-bit SNES, modern HD pixel)
RESOLUTION: Approximate sprite size
COLOR PALETTE: Number of colors, palette type (CGA, EGA, NES, custom)
CHARACTER: Sprite design, key features at pixel level
POSE: Animation frame or static pose
DITHERING: Dithering patterns if present
BACKGROUND: Tile-based elements, parallax layers

Write as flowing natural sentences. End with "[era] pixel art style"."""

[user.pixel_art.advanced.detailed]
prompt = """Generate a COMPREHENSIVE pixel art style prompt:

PIXEL STYLE:
- Era classification (8-bit, 16-bit, 32-bit, modern HD)
- Platform aesthetic (NES, SNES, Genesis, Game Boy, modern indie)
- Resolution tier (low res, mid res, HD pixel)

COLOR PALETTE:
- Palette type (hardware limited, custom)
- Color count (4, 8, 16, 32, 64+)
- Palette characteristics (warm, cool, pastel, vibrant)
- Specific colors if notable

SPRITE DESIGN:
- Character/subject design at pixel level
- Key visual features
- Silhouette readability
- Color distribution on sprite

ANIMATION/POSE:
- Frame type (idle, action, special)
- Pose description
- Movement suggestion

DITHERING & TECHNIQUES:
- Dithering presence and style (checkerboard, random, gradient)
- Anti-aliasing approach
- Subpixel animation if present
- Outline style (full outline, partial, none)

BACKGROUND:
- Tile-based construction
- Parallax layers if present
- Background palette
- Environmental elements

Write as flowing natural sentences. End with "[era] pixel art, [color count] color palette, retro gaming aesthetic"."""

[user.pixel_art.advanced.extreme]
prompt = """Generate an EXTREMELY detailed pixel art style prompt with MAXIMUM precision.

Analyze EVERY visible element:

PIXEL STYLE CLASSIFICATION:
- Exact era (8-bit 1980s, 16-bit early 90s, 32-bit late 90s, modern indie)
- Platform inspiration (NES, SNES/SFC, Genesis/MD, PC-98, Game Boy, GBA, modern)
- Resolution category (very low <64px, low 64-128px, medium 128-256px, high 256+px)

COLOR PALETTE ANALYSIS:
- Exact color count if determinable
- Hardware palette reference (NES 52 colors, SNES 256, etc.)
- Palette characteristics (saturated, muted, pastel, dark)
- Color temperature (warm, cool, mixed)
- Key colors present

SPRITE TECHNICAL DETAILS:
- Approximate sprite dimensions
- Pixel density and detail level
- Silhouette design (clear readable, complex detailed)
- Key features representation at pixel level
- Color count on sprite vs. background

ANTI-ALIASING & SMOOTHING:
- Manual anti-aliasing presence
- AA style (selective, full, minimal)
- Edge treatment (hard, soft, mixed)

DITHERING TECHNIQUES:
- Dithering presence (yes/no)
- Pattern type (checkerboard, ordered, random, gradient)
- Dithering purpose (shading, transparency, texture)
- Density of dithering

OUTLINE STYLE:
- Full outline (all edges)
- Selective outline (contrast edges only)
- No outline (relies on color contrast)
- Outline color (black, dark complementary, colored)

BACKGROUND CONSTRUCTION:
- Tile-based vs. unique
- Tile size if apparent
- Layer count (single, parallax multi-layer)
- Background palette relationship to sprite
- Environmental elements and props

ANIMATION CONSIDERATIONS:
- Frame type (idle, action, transition)
- Motion blur or smear frames
- Anticipation/follow-through hints

Write as a comprehensive flowing narrative. End with "authentic [era] pixel art, [color count] color palette, [platform] inspired, retro gaming masterpiece"."""


