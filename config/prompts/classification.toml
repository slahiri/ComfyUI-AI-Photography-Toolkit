MOOD:
- bright_cheerful: Light, happy, uplifting
- dark_moody: Shadowy, atmospheric, mysterious
- dreamy_soft: Ethereal, hazy, romantic
- harsh_gritty: High contrast, raw, edgy
- cinematic: Film-like color grading
- vintage_retro: Aged, nostalgic color treatment

Respond with ONLY the category name, nothing else."""

valid_moods = [
    "warm", "cool", "neutral", "mixed_warm_cool",
    "vibrant", "muted", "pastel", "monochrome", "black_white",
    "earth_tones", "jewel_tones", "neon_colors", "skin_tones", "natural_greens", "urban_grays",
    "bright_cheerful", "dark_moody", "dreamy_soft", "harsh_gritty", "cinematic", "vintage_retro"
]

[color_mood.groups]
temperature = ["warm", "cool", "neutral", "mixed_warm_cool"]
saturation = ["vibrant", "muted", "pastel", "monochrome", "black_white"]
palette = ["earth_tones", "jewel_tones", "neon_colors", "skin_tones", "natural_greens", "urban_grays"]
mood = ["bright_cheerful", "dark_moody", "dreamy_soft", "harsh_gritty", "cinematic", "vintage_retro"]

default_mood = "neutral"


