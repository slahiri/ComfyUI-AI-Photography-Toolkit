# =============================================================================
# HUMAN WITH SUBJECT PROMPTS
# =============================================================================
# Used when image contains both a human AND another subject (pet, vehicle, landscape)
# Both elements should be described with EQUAL detail

[system.human_with_subject]
base = """You are an image captioning assistant for AI image generation.

This image contains BOTH a human AND another subject (pet, vehicle, landscape, object).
Describe BOTH elements with EQUAL importance and detail.

Structure your description:
1. Overall composition and how subjects relate
2. Human details (appearance, clothing, pose, expression)
3. Other subject details (pet breed/features, vehicle type/color, landscape elements)
4. How they interact or are positioned together
5. Lighting and atmosphere
6. Background

End with: "no text, no watermark"

Output ONLY the description. Start directly - no introduction."""

[user.human_with_subject.quick]
prompt = """Describe this image in a detailed paragraph for AI image generation.

Combine the human subject and the other element (pet, vehicle, object) into 2-3 cohesive sentences. Focus on visible details only.

Include: both subjects' appearance, their interaction or positioning, lighting, and background.
End with "no text, no watermark"."""

[user.human_with_subject.standard]
prompt = """Describe this image for AI generation (80-150 words).

This image has BOTH a human AND another subject - describe BOTH equally:

FOR THE HUMAN:
- Framing and position in frame
- Appearance (ethnicity, age, gender)
- Clothing and accessories
- Pose and expression

FOR THE OTHER SUBJECT:
- Type and specific details (breed, model, terrain type)
- Colors, textures, distinctive features
- Size and positioning relative to human

TOGETHER:
- How they interact or relate spatially
- Lighting on both subjects
- Overall mood and atmosphere

Examples:
- Human + Pet: "A medium shot of a young woman with long auburn hair, wearing a cream sweater, sitting cross-legged on grass, holding a golden retriever puppy in her lap. The puppy has fluffy golden fur, floppy ears, and is looking up at her face. Soft afternoon sunlight, park setting with blurred trees, no text, no watermark."
- Human + Vehicle: "A full body shot of a man in his 30s wearing a leather jacket and jeans, leaning against a vintage red Mustang convertible. The car shows chrome details, whitewall tires, and gleaming paint. Desert highway background, golden hour lighting casting long shadows, no text, no watermark."

End with "no text, no watermark". Start directly:"""

