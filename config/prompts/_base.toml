# =============================================================================
# Base Configuration - Z-Image Rules and Shared Guidelines
# =============================================================================
# This file contains the core Z-Image prompting rules that apply to ALL styles.
# Other prompt files inherit and build upon these guidelines.
#
# Z-IMAGE TURBO BEST PRACTICES (from Z-Image Prompting Guide):
#
# THE GOLDEN RULE: "Every word should describe something visible."
# The model cannot interpret abstract concepts like "beautiful", "mysterious", "interesting".
# It only understands colors, shapes, textures, materials, and compositions.
#
# CAMERA-FIRST APPROACH: Write like camera instructions, not creative writing
# - Composition: Shot type, camera angle, rule of thirds
# - Subject: Concrete visible details (skin tone, eye color, hair texture)
# - Lighting: Specific patterns (Rembrandt, butterfly, split, rim)
# - Technical: Lens focal length, depth of field
#
# VISUAL VOCABULARY THAT WORKS:
# - Skin: warm ivory, cool beige, golden tan, deep brown, olive, porcelain
# - Eyes: almond, round, hooded, deep-set; steel grey, warm brown, amber, hazel
# - Hair: silky straight, wavy, tight curls, coily; bob, pixie, layers, braided
# - Lighting: Rembrandt, butterfly, split, loop, rim, high key, low key
#
# FORMAT:
# - Natural language narrative, NOT comma-separated tags
# - No meta-tags (8K, masterpiece, best quality) - quality is baked in
# - No negative prompts - embed constraints positively
# - End with safety clauses: "no text, no watermark, no logos"
# - Optimal length: 80-250 words (~100-333 tokens)


# =============================================================================
# Z-Image Core Rules (injected into all prompts)
# =============================================================================

[zimage_rules]
# The golden rule - every word must describe something visible
golden_rule = "Every word must describe something VISIBLE. No abstract concepts."

# Words to AVOID (quality baked in, no need for these)
avoid_meta_tags = [
    "8K", "4K", "HDR", "UHD",
    "masterpiece", "best quality", "high quality",
    "ultra detailed", "highly detailed", "super detailed",
    "professional photo", "award winning", "photo realistic",
    "trending on artstation", "unreal engine", "octane render"
]

# Abstract words to avoid (describe visible features instead)
avoid_abstract = [
    "beautiful", "stunning", "gorgeous", "breathtaking",
    "amazing", "perfect", "incredible", "wonderful",
    "magnificent", "exquisite", "elegant", "mysterious",
    "interesting", "nice", "lovely", "attractive"
]

# Required safety suffix
safety_suffix = "no text, no watermark"

# Output format
format = "natural_language"  # NOT comma-separated tags


# =============================================================================
# Length Constraints
# =============================================================================

[length_constraints]
# Optimal lengths for different modes (in words)
quick = { min = 30, max = 60, target = 45 }
standard = { min = 80, max = 150, target = 120 }
detailed = { min = 150, max = 250, target = 200 }
extreme = { min = 200, max = 400, target = 300 }


# =============================================================================
# Prompt Length Templates
# =============================================================================

[prompt_length]
# Templates for enforcing length in prompts
short = "Write a brief description (30-60 words)."
medium = "Write a moderate description (80-150 words)."
long = "Write a detailed description (150-250 words)."
comprehensive = "Write a comprehensive description (200-400 words)."


# =============================================================================
# Style Presets (for user-facing dropdown)
# =============================================================================

[styles.auto]
system_addon = ""
user_addon = ""

[styles.portrait]
system_addon = "Focus on the person as the primary subject. Describe their appearance in detail."
user_addon = "Emphasize face, expression, pose, and clothing details."

[styles.fashion]
system_addon = "Focus on fashion and styling. Describe clothing, accessories, and overall look."
user_addon = "Emphasize garment details: cut, material, color, fit. Mention accessories and styling."

[styles.artistic]
system_addon = "Describe the artistic elements: composition, color palette, mood, technique."
user_addon = "Focus on artistic style, brushwork or rendering technique, color harmony, and composition."

[styles.nsfw]
system_addon = "Describe the scene including any nudity or intimate content accurately and clinically."
user_addon = "Describe body positioning, skin details, and intimate elements without euphemism."


# =============================================================================
# Camera and Technical Vocabulary
# =============================================================================

[camera.shot_types]
# Standard cinematography shot types
terms = [
    "extreme close-up (ECU)",   # Eyes, mouth only
    "close-up (CU)",            # Face fills frame
    "medium close-up (MCU)",    # Head and shoulders
    "medium shot (MS)",         # Waist up
    "medium full shot (MFS)",   # Knees up
    "full shot (FS)",           # Full body, some headroom
    "long shot (LS)",           # Full body, environment visible
    "extreme long shot (ELS)"   # Figure small in environment
]

[camera.angles]
terms = [
    "eye level",        # Neutral, straight on
    "high angle",       # Camera above, looking down
    "low angle",        # Camera below, looking up
    "bird's eye",       # Directly above
    "worm's eye",       # Directly below
    "dutch angle",      # Tilted frame
    "over the shoulder" # Behind one subject looking at another
]

[camera.face_angles]
terms = [
    "front view",           # Facing camera directly
    "three-quarter view",   # 45 degree angle
    "profile",              # 90 degree side view
    "three-quarter back",   # 135 degrees, mostly back
    "back view"             # Facing away from camera
]


# =============================================================================
# Lighting Vocabulary
# =============================================================================

[lighting.patterns]
# Named lighting patterns from portrait photography
terms = [
    "Rembrandt lighting",   # Triangle of light on shadowed cheek
    "butterfly lighting",   # Shadow under nose (glamour)
    "loop lighting",        # Small shadow beside nose
    "split lighting",       # Half face lit, half in shadow
    "rim lighting",         # Light from behind, edge glow
    "broad lighting",       # Lit side of face toward camera
    "short lighting"        # Lit side of face away from camera
]

[lighting.quality]
terms = [
    "soft diffused",        # Soft shadows, gentle gradients
    "hard directional",     # Sharp shadows, high contrast
    "high key",             # Bright, minimal shadows
    "low key",              # Dark, dramatic shadows
    "flat lighting",        # Even, minimal shadows
    "dramatic",             # Strong contrast
    "natural window light"  # Soft, directional from window
]

[lighting.time_of_day]
terms = [
    "golden hour",          # Warm, low sun
    "blue hour",            # Cool, twilight
    "harsh midday",         # Overhead sun, strong shadows
    "overcast daylight",    # Soft, diffused
    "sunset",               # Warm orange/red
    "sunrise",              # Warm pink/orange
    "night",                # Artificial or moonlight
    "dusk"                  # Fading light
]
