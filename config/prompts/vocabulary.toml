# =============================================================================
# TERRAIN VOCABULARY GUIDES (for reference)
# =============================================================================

[vocabulary.terrain_desert_guide]
description = "For desert scenes, include: sand color (gold, white, red, brown), dune shapes (crescent, linear, star), rock formations (buttes, mesas, arches), vegetation (cactus, scrub), and atmospheric conditions (heat shimmer, dust)."
example = "Rolling golden sand dunes with sharp crescent ridges, scattered red sandstone buttes in midground, sparse saguaro cacti, pale blue hazy sky with heat shimmer, harsh midday light casting deep shadows."

[vocabulary.terrain_mountain_guide]
description = "For mountain scenes, include: peak shape and count, rock type and color, snow/ice coverage, treeline position, foreground elements, and atmospheric depth."
example = "Three jagged granite peaks with snow-capped summits, exposed gray rock faces above treeline, dense dark conifer forest covering lower slopes, turquoise glacial lake in foreground with rippled surface, low clouds wrapping middle peak, cool blue-cyan color grade."

[vocabulary.terrain_coastal_guide]
description = "For coastal scenes, include: beach type (sand, rock, pebble), water color and texture, wave conditions, tide state, coastal features (cliffs, stacks), and sky reflection."
example = "Rocky coastline with dramatic sea stacks, dark volcanic sand beach, crashing white-foam breakers, deep teal ocean with rolling swells, weathered cliff faces, dramatic sunset sky reflecting orange on wet sand."

[vocabulary.terrain_forest_guide]
description = "For forest scenes, include: tree species and density, canopy coverage, understory vegetation, light filtering, ground cover, and seasonal state."
example = "Dense old-growth conifer forest with towering Douglas fir, dark green canopy filtering dappled light, fern-covered forest floor, fallen moss-covered logs, misty atmosphere with rays of light penetrating canopy."

[vocabulary.terrain_valley_guide]
description = "For valley scenes, include: valley shape (U-shaped glacial, V-shaped river), floor features, surrounding slopes, water features, and scale indicators."
example = "Wide U-shaped glacial valley with flat meadow floor, meandering river with clear water, steep forested slopes on both sides, distant snow-capped peaks at valley head, morning mist lingering in valley bottom."
