- Shadow density (soft/hard)

CHEST/TORSO (if visible):
- Highlight areas
- Shadow areas (cleavage shadow, under-bust, side shadows)
- Light wrap-around

ARMS & HANDS (if visible):
- Highlight placement
- Shadow placement
- Muscle definition from shadows

BODY OVERALL:
- Main light direction
- Key light vs fill light ratio
- Rim/edge lighting presence
- Color temperature of shadows (warm/cool/neutral)

Output JSON:
{
  "face_lighting": {
    "highlights": ["<areas>"],
    "shadows": ["<areas>"],
    "direction": "<direction>",
    "shadow_density": "<soft/medium/hard>"
  },
  "chest_lighting": {
    "highlights": ["<areas>"],
    "shadows": ["<areas>"],
    "visible": true/false
  },
  "arm_lighting": {
    "highlights": "<description>",
    "shadows": "<description>",
    "visible": true/false
  },
  "overall": {
    "main_direction": "<direction>",
    "key_fill_ratio": "<ratio>",
    "rim_light": true/false,
    "shadow_color_temp": "<warm/cool/neutral>"
  },
  "prompt_description": "<comprehensive lighting description for image generation>"
}
"""

[light_shadow_body.standard]
prompt = """
Describe light and shadow on the body:

FACE:
