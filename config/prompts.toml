"""


# =============================================================================
# USER PROMPTS BY MODE - BASIC TIER (Ollama, LM Studio, Local)
# =============================================================================
# For non-reasoning local models: direct instructions, no numbered lists,
# explicit output format instructions

[user.basic.quick]
prompt = """Write a brief 30-50 word description of this image. Start directly with the description, for example: "A woman with long dark hair wearing a red dress stands in a garden..."

Describe the person, their clothing, and the setting."""

[user.basic.standard]
prompt = """Write a detailed description of this image that could be used as an AI image generation prompt.

Include: who is in the image (appearance, ethnicity, age), what they are wearing (colors, materials), their pose and expression, and the background/lighting.

Example format: "A young Asian woman with shoulder-length black hair, wearing a white blouse and blue jeans, sitting on a wooden bench in a sunlit park. Soft natural lighting, blurred trees in background."

Now describe this image in similar format:"""

[user.basic.detailed]
prompt = """Write a comprehensive description of this image for AI image generation.

Cover these aspects in a flowing paragraph: the subject's appearance (ethnicity, skin tone, age, build), their hair (color, style, length), facial expression and features, all visible clothing (specific items, colors, materials), their body pose and positioning, and the setting (background, lighting quality).

Example: "A Hispanic woman in her late twenties with olive skin and wavy chestnut brown hair falling past her shoulders. She has a warm smile and brown eyes with subtle makeup. She wears a fitted emerald green dress with thin straps. She stands with one hand on her hip, leaning slightly against a white wall. Warm golden hour lighting from the left creates soft shadows."

Now describe this image in similar detail:"""

[user.basic.extreme]
prompt = """Write the most detailed description possible of this image for AI image generation.

Describe everything visible: the subject's complete appearance (precise ethnicity, skin tone with undertones, approximate age), hair (exact color, style, texture, length), facial features (shape, expression, eye details, makeup), ALL clothing items with specific colors and materials, body pose and positioning, any visible tattoos or accessories, jewelry, and the complete setting including lighting direction, quality, and background details.

Start directly with the description - no introduction needed. Write a single flowing paragraph covering all visible details:"""


# =============================================================================
# AGENTIC PROMPTS - For reasoning-enabled multi-step analysis
# =============================================================================

[agentic.advanced]
# Full agentic prompt for advanced models
intro = """
You are performing a comprehensive visual analysis for Z-Image prompt generation.
Analyze each component separately, then synthesize into a flowing prompt.
"""

synthesis = """
Now combine all analysis into a single flowing narrative prompt.
Start with framing, then subject, then details, then lighting.
Output ONLY the final prompt text.
"""

[agentic.standard]
intro = """
Analyze this image step by step for prompt generation.
Focus on the most important visual elements.
"""

synthesis = """
Combine your analysis into a single description.
Focus on subject, clothing, pose, and setting.
"""

[agentic.basic]
# Simplified for local models - single pass instead of multi-step
# Local models don't benefit from multi-step reasoning, use direct prompts
intro = """Write a detailed description of this image for AI image generation. Include the subject's appearance, clothing, pose, and the setting. Start directly with the description - no introduction needed."""

synthesis = """Now write the final description as a single flowing paragraph. Start directly with "A..." or the subject description. Do not include phrases like "Here is" or "The image shows"."""
