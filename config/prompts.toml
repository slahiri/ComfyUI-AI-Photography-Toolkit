# =============================================================================
# LIGHTING KEYWORDS LIBRARY (for reference)
# =============================================================================
# These lighting keywords work exceptionally well with Z-Image:
#
# Natural: soft diffused daylight, golden hour warm light, overcast soft light
# Studio: studio portrait lighting, three-point lighting, soft box lighting
# Dramatic: cinematic warm key light, high-contrast noir lighting, rim lighting
# Creative: split lighting, Rembrandt lighting, butterfly lighting, top-down spotlight
# Mood: cool ambient light, warm candlelight, neon glow, backlit silhouette


# =============================================================================
# ANIME/MANGA TERMINOLOGY REFERENCE
# =============================================================================
# Common anime hair styles:
# - twin tails / twintails: Two pigtails on sides
# - ahoge: Single strand of hair sticking up (antenna hair)
# - hime cut: Straight bangs with sidelocks
# - side tail: Ponytail to one side
# - drill curls / ringlets: Spiral curled hair
# - odango: Bun hairstyle (like Sailor Moon)
#
# Common anime eye styles:
# - heterochromia: Different colored eyes
# - tsurime: Sharp upward-slanting eyes
# - tareme: Soft drooping eyes
# - catchlights: Bright reflections in eyes
#
# Common anime visual elements:
# - blush lines: Horizontal lines across cheeks/nose
# - sweat drop: Comedic embarrassment indicator
# - sparkles/shoujo bubbles: Decorative background elements
# - speed lines: Motion indicators
