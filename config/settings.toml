# =============================================================================
# SID Photography Toolkit - Settings
# =============================================================================

[development]
# Note: Debug Agent is now always available for all users

[debug_agent]
# Default settings for the debug agent node
default_save_results = true
default_update_knowledge = false

# Storage paths (relative to toolkit root)
knowledge_base_path = "knowledge_base"
results_path = "debug_results"

# Search settings
search_cache_hours = 168  # 7 days
max_search_results = 5
