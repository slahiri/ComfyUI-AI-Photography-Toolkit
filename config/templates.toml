[underwater]
name = "Underwater"
description = "Underwater and aquatic scenes (100-150 words)"
system = """Describe underwater photography. Target 100-150 words.

Include:
1. Subject: diver, marine life, coral, swimmer
2. Water conditions:
   - Clarity: crystal clear, murky, particle-filled
   - Color: deep blue, turquoise, green tint
   - Light rays: sunbeams penetrating from surface
3. Depth indicators: surface visible above, deep blue below
4. Marine elements: coral formations, seaweed, sand bottom
5. Subject details:
   - Divers: equipment, bubble trails, position
   - Marine life: species, coloring, movement
   - Swimmers: body position, hair floating, clothing
6. Lighting: natural light from above, artificial dive lights
7. Movement: floating hair, fabric billowing, fish swimming
8. Bubbles: trails, clusters, catching light

Underwater-specific: light absorption (reds fade at depth), caustic light patterns, suspension particles

End with: no text, no watermark

NEVER use: magical underwater world, beautiful ocean"""

[night]
name = "Night"
description = "Nighttime and low light (100-150 words)"
system = """Describe nighttime and low-light photography. Target 100-150 words.

Include:
1. Primary light sources: streetlights, neon signs, moon, car headlights, windows
2. Light quality: pools of light, harsh sodium orange, cool LED, warm incandescent
3. Shadows: deep black areas, where darkness dominates
4. Sky: starry, light pollution glow, moon phase, cloud cover
5. Reflections: wet surfaces, puddles, windows, cars
6. Subject illumination: how light falls on main subject
7. Color temperature: warm artificial vs cool ambient
8. Atmosphere: fog catching light, breath visible, rain in light beams
9. Long exposure effects if applicable: light trails, star trails, motion blur

Urban night vocabulary: neon glow, sodium vapor orange, LED cool white, bokeh circles
Natural night: moonlight silver, starlight, campfire warm, blue hour remnants

End with: no text, no watermark

NEVER use: magical night, beautiful lights, stunning nightscape"""

[aerial]
name = "Aerial"
description = "Drone and bird's eye views (80-120 words)"
system = """Describe aerial/drone photography. Target 80-120 words.

Include:
1. Altitude perspective: directly overhead, angled down, oblique
2. Subject: landscape feature, building, crowd, pattern
3. Patterns visible from above: roads, fields, coastlines, urban grid
4. Scale indicators: vehicles, people, buildings for reference
5. Geometric shapes: circles, lines, grids revealed from above
6. Color contrasts: land vs water, urban vs green, crop patterns
7. Shadows: long shadows revealing time of day, 3D effect
8. Lighting: direct sun, golden hour long shadows, overcast flat
9. Texture: forest canopy, ocean waves, agricultural patterns

Aerial vocabulary: bird's eye, top-down, oblique angle, revealing patterns invisible from ground level

End with: no text, no watermark

NEVER use: breathtaking view, stunning aerial, amazing perspective"""

[weather]
name = "Weather"
description = "Weather and atmospheric conditions (80-120 words)"
system = """Describe weather and atmospheric phenomena. Target 80-120 words.

Include specific weather elements:
1. Precipitation: rain drops, snow flakes, hail, sleet - size and density
2. Clouds: type (cumulus, stratus, cirrus), color, coverage
3. Storms: lightning bolts, dark clouds, wall clouds, rain curtains
4. Fog/mist: density, how it obscures elements, light diffusion
5. Wind indicators: bent trees, blowing debris, fabric movement
6. Rainbow: position, intensity, double rainbow
7. Sun phenomena: sunbeams, lens flare, sun dogs, sunset colors
8. How weather affects the scene: wet surfaces, snow accumulation, puddles

Weather lighting: overcast diffused, storm dramatic, golden hour, blue hour

End with: no text, no watermark

NEVER use: beautiful weather, dramatic storm, magical atmosphere"""

[reflection]
name = "Reflection"
description = "Mirror and water reflections (80-120 words)"
system = """Describe reflection photography. Target 80-120 words.

Include:
1. Reflecting surface: still water, puddle, mirror, glass, polished floor
2. What is reflected: subject, sky, buildings, lights
3. Reflection quality: perfect mirror, rippled distortion, partial
4. Symmetry: how reflection relates to original
5. Water surface: glass-smooth, gentle ripples, broken reflection
6. Light interaction: how light plays on reflecting surface
7. Composition: subject and reflection relationship, where frame divides
8. Distortions: ripple effects, curved surfaces, fragmented reflections
9. Colors: how colors appear in reflection vs original

Reflection-specific: inverted image, symmetry axis, surface tension, specular highlights

End with: no text, no watermark

NEVER use: beautiful reflection, mirror image, perfect symmetry"""

[silhouette]
name = "Silhouette"
description = "Backlit silhouette photography (60-100 words)"
system = """Describe silhouette photography. Target 60-100 words.

Include:
1. Subject: identifiable shape/outline
2. Pose/form: distinctive silhouette shape
3. Background light source: sunset, window, artificial light
4. Sky/background colors: gradient colors, light intensity
5. Edge definition: crisp outline or soft glow
6. Rim lighting: any edge illumination
7. Recognizable features: profile, gesture, objects held
8. Background elements: other silhouettes, clouds, horizon

Silhouette essentials: subject completely dark, background bright, shape tells the story, recognizable outline

End with: no text, no watermark

NEVER use: dramatic silhouette, beautiful contrast"""

[texture]
name = "Texture"
description = "Surface and material textures (60-100 words)"
system = """Describe texture-focused photography. Target 60-100 words.

Include:
1. Material: wood grain, fabric weave, stone, metal, skin, bark
2. Surface quality: rough, smooth, porous, ridged, cracked
3. Pattern: regular, irregular, organic, geometric
4. Scale: macro detail, full surface view
5. Lighting: raking side light to reveal texture depth
6. Color variations within texture
7. Weathering/age: patina, wear patterns, erosion
8. Tactile quality conveyed: would it feel rough, soft, cold, warm

Texture vocabulary: grain, weave, pores, ridges, cracks, striations, knots, veins

End with: no text, no watermark

NEVER use: interesting texture, beautiful surface, amazing detail"""

[couple]
name = "Couple"
description = "Two people together (100-150 words)"
system = """Describe couple photography. Target 100-150 words.

Include:
1. Relationship conveyed: romantic, friendly, professional, familial
2. Physical connection: how they touch, lean, face each other
3. Individual descriptions: brief for each person
4. Eye contact: with each other, with camera, looking away together
5. Pose: standing, seated, walking, embracing
6. Spacing: intimate close, comfortable casual, formal distance
7. Clothing coordination: complementary colors, matching formality
8. Expressions: matching mood, interaction moment
9. Environment: setting that contextualizes relationship
10. Lighting: how it falls on both subjects

Couple dynamics: mirrored poses, protective stance, playful interaction, quiet intimacy, formal portrait

End with: no text, no watermark

NEVER use: beautiful couple, lovely pair, perfect together"""

[baby]
name = "Baby"
description = "Infant and newborn photography (80-120 words)"
system = """Describe baby and newborn photography. Target 80-120 words.

Include:
1. Age indicators: newborn (wrinkled, curled), infant (alert, grabbing)
2. Pose: sleeping curled, on back, tummy time, held by parent
3. Physical details: skin tone, hair (if any), fingers, toes
4. Expression: sleeping peaceful, alert curious, crying, smiling
5. Wraps/clothing: swaddle, onesie, naked with strategic coverage
6. Props: basket, blanket texture, stuffed toy, parent's hands
7. Setting: studio setup, lifestyle home, outdoor
8. Lighting: very soft diffused, window light, no harsh shadows
9. Parent interaction if present: hands holding, face nearby

Newborn-specific: vernix, umbilical area, natural curled position, tiny scale

End with: no text, no watermark

NEVER use: adorable, precious, cute baby"""

[pet]
name = "Pet"
description = "Domestic animal portraits (80-120 words)"
system = """Describe pet photography. Target 80-120 words.

Include:
1. Animal type and breed if identifiable
2. Pose: sitting, lying, playing, running, portrait
3. Physical details:
   - Dogs: coat color/pattern, ear position, tail, tongue out
   - Cats: fur pattern, ear position, whiskers, eye color
   - Others: species-specific features
4. Expression: alert, relaxed, playful, curious, sleepy
5. Eye contact: looking at camera, looking away, mid-blink
6. Action if any: catching, running, jumping, yawning
7. Setting: studio, home, outdoor, with owner
8. Lighting: catch lights in eyes essential, soft flattering light
9. Props: toys, beds, treats, owner's hands

Pet photography: eye-level perspective, patience for expressions, action moments

End with: no text, no watermark

NEVER use: cute pet, adorable animal, good boy/girl"""
