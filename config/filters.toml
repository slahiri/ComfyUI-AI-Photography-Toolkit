# =============================================================================
# Output Filters for SID Photography Toolkit
# =============================================================================
# These patterns are used to clean LLM output and remove leaked example text
# Note: Use double-quoted strings for regex patterns that need escaping


# =============================================================================
# EXAMPLE TEXT PATTERNS TO REMOVE
# =============================================================================
# Regex patterns that match example/placeholder text that shouldn't be in output

[example_patterns]
# MCU text that was leaking in the original issue
patterns = [
    "MCU head and shoulders portrait[^,]*,",
    "subject fills \\d+% of frame[^,]*,",
    "shallow depth of field with soft bokeh background[^,]*,",
    "e\\.g\\.,?\\s*['\"][^'\"]+['\"]",
    "<[^>]+>",
    "\\[YOUR [^\\]]+\\]",
    "\\[PLACEHOLDER[^\\]]*\\]",
    "DO NOT copy",
    "describe THIS image",
    "ONLY describe what you can SEE",
    "do not invent details",
    "^Here'?s? (?:the |a )?prompt[:\\s]*",
    "^(?:The )?prompt[:\\s]*",
    "^Output[:\\s]*",
    "^Description[:\\s]*",
    "^Image description[:\\s]*",
]


# =============================================================================
# MARKDOWN PATTERNS TO CLEAN
# =============================================================================

[markdown_patterns]
# Remove markdown formatting from output
patterns = [
    "```[a-z]*\\n?",
    "\\*\\*([^*]+)\\*\\*",
    "\\*([^*]+)\\*",
    "^#+\\s+",
    "^[-*]\\s+",
    "\\[([^\\]]+)\\]\\([^)]+\\)",
]


# =============================================================================
# WHITESPACE CLEANUP
# =============================================================================

[whitespace]
# Patterns for cleaning up whitespace issues
collapse_newlines = "\\n\\s*\\n"
collapse_spaces = "\\s+"
double_commas = ",\\s*,"
leading_comma = "^\\s*,\\s*"
trailing_comma = "\\s*,\\s*$"
double_periods = "\\.\\s*\\."


# =============================================================================
# PROVIDER-SPECIFIC CLEANUP
# =============================================================================

[provider_cleanup.ollama]
# Extra patterns for Ollama models
patterns = [
    "\\n\\n\\n+",
    "Note:.*$",
    "I hope this helps.*$",
    "Feel free to ask.*$",
    "Is there anything else.*$",
]

[provider_cleanup.lmstudio]
patterns = [
    "```\\n*$",
    "Let me know.*$",
    "Hope this helps.*$",
]

[provider_cleanup.groq]
# Groq tends to be fast but sometimes adds meta-commentary
patterns = [
    "^Sure,?\\s*",
    "^Certainly,?\\s*",
    "^Of course,?\\s*",
    "\\n\\nIs there anything.*$",
]

[provider_cleanup.together]
# Together AI cleanup
patterns = [
    "^Here is (?:the |a )?(?:detailed )?(?:description|prompt):\\s*",
    "\\n\\n---\\n*$",
    "I hope this (?:helps|description).*$",
]

[provider_cleanup.fireworks]
# Fireworks AI cleanup
patterns = [
    "^Based on (?:the|this) image,?\\s*",
    "\\n\\nLet me know.*$",
]

[provider_cleanup.openai]
# OpenAI/GPT models cleanup
patterns = [
    "^(?:Sure|Certainly|Of course)[!,.]?\\s*",
    "\\n\\nI hope this (?:helps|meets).*$",
]

[provider_cleanup.anthropic]
# Claude models - generally clean but sometimes adds meta
patterns = [
    "^(?:Here's|Here is) (?:the |a )?(?:description|prompt):\\s*",
]

[provider_cleanup.local]
# Local models (QwenVL, Florence, etc.) - most aggressive cleanup
patterns = [
    "\\n\\n\\n+",
    "^(?:Sure|Certainly|Of course)[!,.]?\\s*",
    "Note:.*$",
    "I hope this helps.*$",
    "Is there anything else.*$",
    "Let me know if.*$",
    "Feel free to.*$",
    "^Based on (?:the|this) image,?\\s*",
    "^(?:Here's|Here is) (?:the |a )?(?:detailed )?(?:description|prompt|caption):\\s*",
    "\\[End of (?:description|prompt)\\]",
]

[provider_cleanup.default]
patterns = []


# =============================================================================
# RESPONSE VALIDATION
# =============================================================================

[validation]
# Minimum acceptable response length (words)
min_words = 20
# Maximum retries for short responses
max_retries = 2
# Temperature increase per retry
retry_temp_increase = 0.2
