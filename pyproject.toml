[project]
name = "comfyui-ai-photography-toolkit"
description = "AI-powered photography toolkit for ComfyUI - Re-architecture in progress"
version = "5.0.0-dev"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["comfyui", "ai", "photography"]

authors = [
    { name = "Siddhartha Lahiri" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typing-extensions>=4.0.0",
]

[project.urls]
Repository = "https://github.com/slahiri/ComfyUI-AI-Photography-Toolkit"

[tool.comfy]
PublisherId = "slahiri"
DisplayName = "SID AI Photography Toolkit"
exclude = [".venv", "__pycache__", "*.pyc", ".git", ".env"]
