#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["# ComfyUI-AI-Photography-Toolkit Dependencies", "# Anthropic Claude API", "anthropic>=0.39.0", "# Image processing (usually included with ComfyUI, but listed for completeness)", "pillow>=10.0.0", "numpy>=1.24.0", "# Future dependencies for additional nodes", "# openai>=1.0.0  # For OpenAI integration (future)"]

[project.urls]
Repository = "https://github.com/slahiri/ComfyUI-AI-Photography-Toolkit"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/slahiri/ComfyUI-AI-Photography-Toolkit/wiki"
"Bug Tracker" = "https://github.com/slahiri/ComfyUI-AI-Photography-Toolkit/issues"

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI-AI-Photography-Toolkit"
