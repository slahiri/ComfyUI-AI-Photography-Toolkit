# Prompt Templates for SID_PromptGenerator
# Templates are selected based on detected subject type
# Sections are activated based on tag decisions

templates:
  # ===========================================================================
  # WOMAN SUBJECT
  # ===========================================================================
  woman:
    trigger_tags: ["1girl", "woman", "female", "lady", "female_focus"]

    base_prompt: |
      Describe this woman for AI image generation using technical, concrete terms.
      Focus on visible details: features, colors, textures, materials, lighting, composition.
      Avoid poetic or abstract language. Be specific and literal.

    sections:
      appearance:
        trigger: always
        prompt: |
          Describe her appearance: ethnicity, approximate age impression,
          skin tone and texture, any distinctive features.

      hair:
        trigger: always
        prompt: |
          Describe her hair in detail: arrangement/style (updo, ponytail,
          loose, etc.), color (including highlights), texture (straight,
          wavy, curly), and length.

      face:
        trigger: always
        prompt: |
          Describe her face: shape, features, expression, and gaze direction.

      eyes:
        trigger: always
        prompt: |
          Describe her eyes: color, shape, expression, and any makeup.

      body:
        trigger_conditions:
          shot_type: ["MS", "MFS", "FS", "MLS", "LS"]
          nsfw_level: ["SUGGESTIVE", "EXPLICIT"]
        prompt: |
          Describe her visible body and figure: build, proportions,
          and any notable physical features visible in the image.

      clothing:
        trigger_tags: ["dress", "shirt", "outfit", "wearing", "clothed", "clothes"]
        prompt: |
          Describe her clothing in detail: garment types, colors,
          fabrics/materials, patterns, fit, and style.

      pose:
        trigger_conditions:
          shot_type: ["MCU", "MS", "MFS", "FS", "MLS", "LS"]
        prompt: |
          Describe her pose: body position, arm and hand placement,
          leg position if visible, weight distribution, overall stance.

      expression:
        trigger: always
        prompt: |
          Describe her expression and mood: facial expression,
          emotion conveyed, eye contact direction.

      environment:
        trigger_conditions:
          scene_confidence: "> 0.5"
          not_tags: ["simple_background", "white_background", "plain_background"]
        prompt: |
          Describe the environment and setting: location type,
          background elements, atmosphere, time of day if visible.

      landmark:
        trigger_conditions:
          landmark_detected: true
        prompt: |
          Describe the landmark or famous location visible: identify it,
          describe its architectural features and historical significance.

      sky:
        trigger_conditions:
          sky_visible: true
        prompt: |
          Describe the sky: cloud formations, color gradients,
          sun/moon position if visible.

      lighting:
        trigger: always
        prompt: |
          Describe the lighting: quality (soft/harsh), direction,
          color temperature (warm/cool), shadows, and mood created.

      golden_hour:
        trigger_conditions:
          is_golden_hour: true
        prompt: |
          Describe the golden hour lighting: warm tones, soft shadows,
          rim lighting effects, and the magical quality of the light.

      dramatic_lighting:
        trigger_conditions:
          is_dramatic_lighting: true
        prompt: |
          Describe the dramatic lighting: strong shadows, contrast,
          chiaroscuro effects, and the mood created by the lighting.

      composition:
        trigger: always
        prompt: |
          Describe the framing and composition: shot type (close-up,
          medium, full body), camera angle, subject placement.

      camera_details:
        trigger_conditions:
          camera_angle: true
        prompt: |
          Describe the camera perspective: angle (high/low/eye-level),
          depth of field (shallow/deep), and any lens effects.

    assembly_order:
      - appearance
      - hair
      - face
      - eyes
      - body
      - clothing
      - pose
      - expression
      - environment
      - landmark
      - sky
      - lighting
      - golden_hour
      - dramatic_lighting
      - composition
      - camera_details

