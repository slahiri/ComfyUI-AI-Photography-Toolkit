  # ===========================================================================
  # LANDSCAPE SUBJECT
  # ===========================================================================
  landscape:
    trigger_tags: ["no_humans", "scenery", "landscape", "nature"]
    trigger_conditions:
      places365_category: ["outdoor", "nature", "beach", "mountain", "forest"]

    base_prompt: |
      Describe this landscape for AI image generation using technical, concrete terms.
      Focus on terrain, colors, textures, lighting conditions, atmospheric effects.
      Avoid poetic or abstract language. Be specific and literal.

    sections:
      terrain:
        trigger: always
        prompt: |
          Describe the terrain: type of landscape, geological features,
          vegetation, water bodies if present.

      landmark:
        trigger_conditions:
          landmark_detected: true
        prompt: |
          Describe the landmark: identify the famous location,
          its architectural or natural features, and significance.

      sky:
        trigger_conditions:
          sky_visible: true
        prompt: |
          Describe the sky in detail: cloud formations and types,
          sun/moon position, color gradients.

      weather:
        trigger_conditions:
          weather_condition: true
        prompt: |
          Describe the weather conditions: precipitation, visibility,
          atmospheric effects like fog, mist, or haze.

      time_of_day:
        trigger: always
        prompt: |
          Describe the time of day and its lighting effects.

      golden_hour:
        trigger_conditions:
          is_golden_hour: true
        prompt: |
          Describe the golden hour: warm orange and pink tones,
          long shadows, soft diffused light, rim lighting on edges.

      dramatic_lighting:
        trigger_conditions:
          is_dramatic_lighting: true
        prompt: |
          Describe the dramatic lighting: storm clouds, god rays,
          strong contrast between light and shadow.

      atmosphere:
        trigger: always
        prompt: |
          Describe the overall atmosphere and mood of the scene.

      composition:
        trigger: always
        prompt: |
          Describe the composition: foreground, midground, background
          elements, focal point, depth and perspective.

      camera_details:
        trigger_conditions:
          camera_angle: true
        prompt: |
          Describe the camera perspective and depth of field effects.

      colors:
        trigger: always
        prompt: |
          Describe the color palette: dominant colors, color harmony,
          saturation and contrast.

    assembly_order:
      - terrain
      - landmark
      - sky
      - weather
      - time_of_day
      - golden_hour
      - dramatic_lighting
      - atmosphere
      - composition
      - camera_details
      - colors

